plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}
version = rootProject.mod_version
group = rootProject.mod_group_id
base { archivesName = "biotech-neoforge-${rootProject.minecraft_version_1_21_1}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets {
    uiPreview {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    uiPreviewImplementation.extendsFrom implementation
    uiPreviewRuntimeOnly.extendsFrom runtimeOnly
    uiPreviewCompileOnly.extendsFrom compileOnly
}
neoForge {
    version = rootProject.neoforge_version_1_21_1
    mods {
        "${rootProject.mod_id}" { sourceSet(sourceSets.main) }
        biotech_ui_preview { sourceSet(sourceSets.uiPreview) }
    }
    runs {
        client { client(); loadedMods = [mods.biotech] }
        server { server(); programArgument '--nogui'; loadedMods = [mods.biotech] }
        gameTestServer { type = 'gameTestServer'; loadedMods = [mods.biotech] }
        uiPreview {
            client()
            sourceSet = sourceSets.uiPreview
            loadedMods = [mods.biotech, mods.biotech_ui_preview]
            gameDirectory = layout.buildDirectory.dir('ui-preview-run').get().asFile
            programArguments.addAll '--width', '1024', '--height', '832', '--quickPlaySingleplayer', 'world'
            systemProperty 'biotech.uiPreview.output', layout.buildDirectory.dir('ui-previews').get().asFile.absolutePath
        }
        jeiPreview {
            client()
            sourceSet = sourceSets.uiPreview
            loadedMods = [mods.biotech, mods.biotech_ui_preview]
            gameDirectory = layout.buildDirectory.dir('jei-preview-run').get().asFile
            programArguments.addAll '--width', '1024', '--height', '832', '--quickPlaySingleplayer', 'world'
            systemProperty 'biotech.jeiPreview.enabled', 'true'
            systemProperty 'biotech.jeiPreview.output', layout.buildDirectory.dir('jei-previews').get().asFile.absolutePath
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    addModdingDependenciesTo sourceSets.uiPreview
    unitTest {
        enable()
        testedMod = mods."${rootProject.mod_id}"
        loadedMods = [mods.biotech]
    }
}

tasks.register('renderUiPreviews') {
    group = 'verification'
    description = 'Runs the isolated client renderer and verifies all 87 UI PNG previews.'
    dependsOn 'runUiPreview'
    doLast {
        def output = layout.buildDirectory.dir('ui-previews').get().asFile
        def manifest = new File(output, 'manifest.json')
        if (!manifest.isFile()) throw new GradleException('UI renderer did not finish: manifest.json is missing')
        def entries = new groovy.json.JsonSlurper().parse(manifest)
        if (entries.size() != 87 || entries.collect { it.file }.toSet().size() != 87) {
            throw new GradleException('Expected exactly 87 unique UI previews')
        }
        entries.each { entry ->
            def hatch = entry.file.contains('_hatch-')
            if (entry.width != (hatch ? 432 : 688) || entry.height != (hatch ? 460 : 496) ||
                    entry.guiScale != 2 || !(entry.background in ['plain', 'textured'])) {
                throw new GradleException("Unexpected preview dimensions or settings: ${entry.file}")
            }
            def png = new File(output, entry.file)
            def rendered = javax.imageio.ImageIO.read(png)
            if (rendered == null || rendered.width != entry.width || rendered.height != entry.height) {
                throw new GradleException("Missing or invalid PNG: ${entry.file}")
            }
        }

        // These fixed slot cores contain an adult cow, baby cow, and rabbit respectively.
        // A title-screen/no-level custom renderer produced only the 11-13 backdrop colors here,
        // so require enough color detail to prove that the live entity model actually rendered.
        def assertEntityDetail = { String fileName, int x, int y ->
            def image = javax.imageio.ImageIO.read(new File(output, fileName))
            def colors = new HashSet<Integer>()
            for (int yy = y; yy < y + 24; yy++) {
                for (int xx = x; xx < x + 24; xx++) colors.add(image.getRGB(xx, yy))
            }
            if (colors.size() < 30) {
                throw new GradleException("Animal entity model appears blank in ${fileName}: only ${colors.size()} colors in verified slot core")
            }
        }
        assertEntityDetail('breeding_chamber-active.png', 140, 238)
        // First output cell: viewport (146,104), cell padding 2, icon inset 1, GUI scale 2.
        assertEntityDetail('breeding_chamber-active.png', 326, 242)
        assertEntityDetail('slaughterhouse-active.png', 140, 238)
        logger.lifecycle("Verified 87 UI previews, including live animal entity models, in ${output}")
    }
}

def cleanUiPreviewRun = tasks.register('cleanUiPreviewRun') {
    group = 'verification'
    description = 'Removes stale NeoForge state before preparing the isolated UI preview client.'
    outputs.upToDateWhen { false }
    doLast { delete layout.buildDirectory.dir('ui-preview-run') }
}

tasks.named('prepareUiPreviewRun').configure {
    dependsOn cleanUiPreviewRun
}

tasks.named('runUiPreview').configure {
    // The production animal item renderer needs a ClientLevel. Reuse the deterministic
    // GameTest world so visual previews exercise the real in-game entity renderer rather
    // than silently rendering blank items from the title screen.
    dependsOn 'runGameTestServer'
    doFirst {
        // Stale screenshots must never satisfy verification.
        delete layout.buildDirectory.dir('ui-previews')
        def runDir = layout.buildDirectory.dir('ui-preview-run').get().asFile
        runDir.mkdirs()
        def sourceWorld = file('run/world')
        if (!new File(sourceWorld, 'level.dat').isFile()) {
            throw new GradleException('UI preview world was not produced by runGameTestServer')
        }
        def previewWorld = new File(runDir, 'saves/world')
        delete previewWorld
        copy {
            from sourceWorld
            into previewWorld
            exclude 'session.lock'
        }
        new File(runDir, 'options.txt').text = 'guiScale:2\nmaxFps:60\nenableVsync:false\nlang:en_us\n'
    }
}

def generatedGameTestResources = layout.buildDirectory.dir('generated/gametestResources')
def generateGameTestStructure = tasks.register('generateGameTestStructure') {
    outputs.dir(generatedGameTestResources)
    doLast {
        def structureFile = generatedGameTestResources.get()
                .file("data/${rootProject.mod_id}/structure/empty.nbt").asFile
        structureFile.parentFile.mkdirs()
        structureFile.bytes = java.util.Base64.getDecoder().decode(
                'H4sIAAAAAAAC/03KsQ5AMBSF4SMVlIj3MZuN9qu5khu00t7J09NYDGf4cv4WMOgmUlo4JgkeGJJFmeRmg3z+ZlFfdLAqty+LBuVMJ6M/xbOLtOlIEmFRrUdwe8rRq4a9igp/xgNEun/FcgAAAA==')
    }
}

sourceSets.main.resources {
    srcDir generatedGameTestResources
    srcDir 'src/generated/resources'
    // Never package stale 1.20-era plural datapack directories on 1.21+.
    exclude 'data/biotech/recipes/**'
    exclude 'data/biotech/loot_tables/**'
}

def generateBiotechResources = tasks.register('generateBiotechResources', JavaExec) {
    systemProperty 'biotech.animalVersion', '121'
    group = 'build'
    description = 'Regenerates deterministic Biotech recipes, machine assets, and generated loot tables.'
    dependsOn tasks.named('compileJava')
    classpath = files(sourceSets.main.output.classesDirs, configurations.compileClasspath)
    mainClass = 'com.nstut.biotech.data.DataGenerator'
    workingDir project.projectDir
    doFirst {
        // Remove obsolete pre-1.21 generated datapack trees before generating the authoritative layout.
        project.delete('src/generated/resources/data/biotech/recipes')
        project.delete('src/generated/resources/data/biotech/loot_tables')
    }
}

tasks.register('generateRecipes') {
    group = 'build'
    description = 'Regenerates Biotech recipe data (and the coupled deterministic generated resources).'
    dependsOn generateBiotechResources
}

def verifyGeneratedRecipes = tasks.register('verifyGeneratedRecipes') {
    group = 'verification'
    description = 'Verifies generated machine recipes are complete and use the 1.21+ datapack/schema contract.'
    dependsOn generateBiotechResources
    doLast {
        def recipeDir = file('src/generated/resources/data/biotech/recipe')
        def recipeFiles = fileTree(recipeDir) { include '*.json' }.files
        if (recipeFiles.size() != 160) {
            throw new GradleException("Expected 160 generated Biotech machine recipes, found ${recipeFiles.size()}")
        }
        recipeFiles.each { recipe ->
            def text = recipe.getText('UTF-8')
            ['"Count"', '"FluidName"', '"Amount"'].each { legacyKey ->
                if (text.contains(legacyKey)) {
                    throw new GradleException("${recipe} still contains legacy recipe key ${legacyKey}")
                }
            }
        }
        if (file('src/generated/resources/data/biotech/recipes').exists()) {
            throw new GradleException('Legacy generated recipes/ directory still exists')
        }
        if (file('src/generated/resources/data/biotech/loot_tables').exists()) {
            throw new GradleException('Legacy generated loot_tables/ directory still exists')
        }
        if (!file('src/generated/resources/data/biotech/loot_table').isDirectory()) {
            throw new GradleException('Generated loot_table/ directory is missing')
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn generateGameTestStructure, generateBiotechResources
    // Hand-authored legacy loot-table sources are still remapped until they are migrated separately.
    from('src/main/resources/data/biotech/loot_tables') { into 'data/biotech/loot_table' }
}
tasks.named('sourcesJar').configure { dependsOn generateGameTestStructure, generateBiotechResources }
tasks.named('check').configure { dependsOn verifyGeneratedRecipes }

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository { maven { name = "Jared's maven"; url = 'https://maven.blamejared.com/' } }
        filter { includeGroup 'mezz.jei' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Curse Maven'; url = 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
def nstutLibDependency = providers.gradleProperty('nstut_lib_dependency')
        .orElse("com.nstut.nstutlib:nstutlib-neoforge-1.21.1:${rootProject.nstut_lib_version}").get()
dependencies {
    implementation "com.nstut:openui-mc-neoforge-1.21.1:${rootProject.openui_version}"
    implementation nstutLibDependency
    runtimeOnly "curse.maven:patchouli-306770:${rootProject.patchouli_file_1_21_1}"

    localRuntime "curse.maven:cloth-config-348521:${rootProject.dev_cloth_config_file_1_21_1}"
    localRuntime "curse.maven:guideme-1173950:${rootProject.dev_guideme_file_1_21_1}"
    localRuntime "curse.maven:powah-rearchitected-633483:${rootProject.dev_powah_file_1_21_1}"
    localRuntime "curse.maven:pipez-443900:${rootProject.dev_pipez_file_1_21_1}"

    compileOnly "mezz.jei:jei-${rootProject.minecraft_version_1_21_1}-common-api:${rootProject.jei_version_1_21_1}"
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version_1_21_1}-neoforge-api:${rootProject.jei_version_1_21_1}"
    runtimeOnly "mezz.jei:jei-${rootProject.minecraft_version_1_21_1}-neoforge:${rootProject.jei_version_1_21_1}"
    compileOnly "maven.modrinth:jade:${rootProject.jade_version_1_21_1}"
    localRuntime "maven.modrinth:jade:${rootProject.jade_version_1_21_1}"
    compileOnly "org.projectlombok:lombok:${rootProject.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${rootProject.lombok_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def p = [mod_id: rootProject.mod_id, mod_name: rootProject.mod_name, mod_version: rootProject.mod_version,
             mod_description: rootProject.mod_description, mod_authors: rootProject.mod_authors, mod_license: rootProject.mod_license,
             minecraft_version_range: rootProject.minecraft_version_range_1_21_1, neo_version: '21.1', patchouli_version_range: '[1.21.1-93,)']
    inputs.properties p; expand p; from 'src/main/templates'; into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = base.archivesName.get() } } }

// Real JEI integration gate: all categories, precise chance tooltips, catalysts, and scrolling.
tasks.register('renderJeiPreviews') {
    group = 'verification'
    description = 'Runs real JEI slot/tooltip/scroll assertions and verifies 17 client screenshots.'
    dependsOn 'runJeiPreview'
    doLast {
        def output = layout.buildDirectory.dir('jei-previews').get().asFile
        def manifest = new File(output, 'manifest.json')
        if (!manifest.isFile()) throw new GradleException('JEI renderer did not finish: manifest.json is missing')
        def images = new groovy.json.JsonSlurper().parse(manifest)
        if (images.size() != 17 || images.collect { it.file }.toSet().size() != 17) {
            throw new GradleException('Expected 17 unique real JEI previews')
        }
        images.each { entry ->
            def image = javax.imageio.ImageIO.read(new File(output, entry.file))
            if (image == null || image.width != 1024 || image.height != 832) {
                throw new GradleException("Missing/invalid JEI screenshot: ${entry.file}")
            }
        }
        logger.lifecycle("Verified actual JEI layouts, tooltips, scrolling, and 17 screenshots in ${output}")
    }
}

def cleanJeiPreviewRun = tasks.register('cleanJeiPreviewRun') {
    outputs.upToDateWhen { false }
    doLast { delete layout.buildDirectory.dir('jei-preview-run') }
}
tasks.named('prepareJeiPreviewRun').configure { dependsOn cleanJeiPreviewRun }
tasks.named('runJeiPreview').configure {
    dependsOn 'runGameTestServer'
    doFirst {
        delete layout.buildDirectory.dir('jei-previews')
        def runDir = layout.buildDirectory.dir('jei-preview-run').get().asFile
        runDir.mkdirs()
        def sourceWorld = file('run/world')
        if (!new File(sourceWorld, 'level.dat').isFile()) throw new GradleException('JEI preview requires the GameTest world')
        copy {
            from sourceWorld
            into new File(runDir, 'saves/world')
            exclude 'session.lock'
        }
        new File(runDir, 'options.txt').text = 'guiScale:2\nmaxFps:60\nenableVsync:false\nlang:en_us\n'
    }
}
