plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}
version = rootProject.mod_version
group = rootProject.mod_group_id
base { archivesName = "biotech-forge-${rootProject.minecraft_version_1_20_1}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }

legacyForge {
    version = "${rootProject.minecraft_version_1_20_1}-${rootProject.forge_version_1_20_1}"
    validateAccessTransformers = true
    addModdingDependenciesTo(sourceSets.test)
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', rootProject.mod_id
        }
        data { data() }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${rootProject.mod_id}" { sourceSet(sourceSets.main) } }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

def generateBiotechResources = tasks.register('generateBiotechResources', JavaExec) {
    group = 'build'
    description = 'Regenerates deterministic Biotech recipes, machine assets, and generated loot tables.'
    dependsOn tasks.named('compileJava')
    classpath = files(sourceSets.main.output.classesDirs, configurations.compileClasspath)
    mainClass = 'com.nstut.biotech.data.DataGenerator'
    workingDir project.projectDir
}

tasks.register('generateRecipes') {
    group = 'build'
    description = 'Regenerates Biotech recipe data (and the coupled deterministic generated resources).'
    dependsOn generateBiotechResources
}

def verifyGeneratedRecipes = tasks.register('verifyGeneratedRecipes') {
    group = 'verification'
    description = 'Verifies Forge 1.20.1 generated machine recipes remain complete and use its legacy recipe contract.'
    dependsOn generateBiotechResources
    doLast {
        def recipeDir = file('src/generated/resources/data/biotech/recipes')
        def recipeFiles = fileTree(recipeDir) { include '*.json' }.files
        if (recipeFiles.size() != 59) {
            throw new GradleException("Expected 59 generated Biotech machine recipes, found ${recipeFiles.size()}")
        }
        if (file('src/generated/resources/data/biotech/recipe').exists()) {
            throw new GradleException('Forge 1.20.1 must keep the plural generated recipes/ directory')
        }
        recipeFiles.each { recipe ->
            def text = recipe.getText('UTF-8')
            if (!text.contains('"Count"')) {
                throw new GradleException("${recipe} no longer uses the Forge 1.20.1 ItemStack Count field")
            }
            if (text.contains('"fluidInputs": [') && !text.contains('"FluidName"') && !text.contains('"fluidInputs": []')) {
                throw new GradleException("${recipe} no longer uses the Forge 1.20.1 FluidName field")
            }
        }
    }
}

repositories {
    mavenLocal()
    maven { name = "Jared's maven"; url = 'https://maven.blamejared.com/' }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}
def nstutLibDependency = providers.gradleProperty('nstut_lib_dependency')
        .orElse("com.nstut.nstutlib:nstutlib-forge-1.20.1:${rootProject.nstut_lib_version}").get()
dependencies {
    modImplementation nstutLibDependency
    modRuntimeOnly "curse.maven:patchouli-306770:${rootProject.patchouli_file_1_20_1}"

    // Dev-only test utilities: generators/energy plus energy, item, and fluid transport.
    modLocalRuntime "curse.maven:cloth-config-348521:${rootProject.dev_cloth_config_file_1_20_1}"
    modLocalRuntime "curse.maven:guideme-1173950:${rootProject.dev_guideme_file_1_20_1}"
    modLocalRuntime "curse.maven:powah-rearchitected-633483:${rootProject.dev_powah_file_1_20_1}"
    modLocalRuntime "curse.maven:pipez-443900:${rootProject.dev_pipez_file_1_20_1}"

    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version_1_20_1}-common-api:${rootProject.jei_version_1_20_1}"
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version_1_20_1}-forge-api:${rootProject.jei_version_1_20_1}"
    modRuntimeOnly "mezz.jei:jei-${rootProject.minecraft_version_1_20_1}-forge:${rootProject.jei_version_1_20_1}"
    compileOnly "org.projectlombok:lombok:${rootProject.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${rootProject.lombok_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}
test { useJUnitPlatform(); dependsOn generateBiotechResources }
tasks.named('processResources', ProcessResources).configure {
    dependsOn generateBiotechResources
    def p = [minecraft_version_range: rootProject.minecraft_version_range_1_20_1,
             forge_version_range: rootProject.forge_version_range_1_20_1,
             loader_version_range: rootProject.forge_loader_range_1_20_1,
             mod_id: rootProject.mod_id, mod_name: rootProject.mod_name, mod_license: rootProject.mod_license,
             mod_version: rootProject.mod_version, mod_authors: rootProject.mod_authors, mod_description: rootProject.mod_description]
    inputs.properties p
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand p }
}
tasks.named('sourcesJar').configure { dependsOn generateBiotechResources }
tasks.named('check').configure { dependsOn verifyGeneratedRecipes }
tasks.named('jar', Jar).configure {
    manifest {
        attributes('Specification-Title': rootProject.mod_id,
                   'Specification-Vendor': rootProject.mod_authors,
                   'Implementation-Title': project.name,
                   'Implementation-Version': project.version)
    }
}
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = base.archivesName.get() } } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
