plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}
version = rootProject.mod_version
group = rootProject.mod_group_id
base { archivesName = "biotech-forge-${rootProject.minecraft_version_1_20_1}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }

legacyForge {
    version = "${rootProject.minecraft_version_1_20_1}-${rootProject.forge_version_1_20_1}"
    validateAccessTransformers = true
    addModdingDependenciesTo(sourceSets.test)
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer' }
        data { data() }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${rootProject.mod_id}" { sourceSet(sourceSets.main) } }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories {
    mavenLocal()
    maven { name = "Jared's maven"; url = 'https://maven.blamejared.com/' }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}
def nstutLibDependency = providers.gradleProperty('nstut_lib_dependency')
        .orElse("com.nstut.nstutlib:nstutlib-forge-1.20.1:${rootProject.nstut_lib_version}").get()
dependencies {
    modImplementation nstutLibDependency
    modRuntimeOnly "curse.maven:patchouli-306770:${rootProject.patchouli_file_1_20_1}"
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version_1_20_1}-common-api:${rootProject.jei_version_1_20_1}"
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version_1_20_1}-forge-api:${rootProject.jei_version_1_20_1}"
    modRuntimeOnly "mezz.jei:jei-${rootProject.minecraft_version_1_20_1}-forge:${rootProject.jei_version_1_20_1}"
    compileOnly "org.projectlombok:lombok:${rootProject.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${rootProject.lombok_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}
test { useJUnitPlatform() }
tasks.named('processResources', ProcessResources).configure {
    def p = [minecraft_version_range: rootProject.minecraft_version_range_1_20_1,
             forge_version_range: rootProject.forge_version_range_1_20_1,
             loader_version_range: rootProject.forge_loader_range_1_20_1,
             mod_id: rootProject.mod_id, mod_name: rootProject.mod_name, mod_license: rootProject.mod_license,
             mod_version: rootProject.mod_version, mod_authors: rootProject.mod_authors, mod_description: rootProject.mod_description]
    inputs.properties p
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand p }
}
tasks.named('jar', Jar).configure {
    manifest {
        attributes('Specification-Title': rootProject.mod_id,
                   'Specification-Vendor': rootProject.mod_authors,
                   'Implementation-Title': project.name,
                   'Implementation-Version': project.version)
    }
}
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = base.archivesName.get() } } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
