plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}
version = rootProject.mod_version
group = rootProject.mod_group_id
base { archivesName = "biotech-neoforge-${rootProject.minecraft_version_26_1_2}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
neoForge {
    version = rootProject.neoforge_version_26_1_2
    addModdingDependenciesTo(sourceSets.test)
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${rootProject.mod_id}" { sourceSet(sourceSets.main) } }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories {
    mavenLocal()
    maven { name = "Jared's maven"; url = 'https://maven.blamejared.com/' }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}
def nstutLibDependency = providers.gradleProperty('nstut_lib_dependency')
        .orElse("com.nstut.nstutlib:nstutlib-neoforge-26.1.2:${rootProject.nstut_lib_version}").get()
dependencies {
    implementation nstutLibDependency
    runtimeOnly "curse.maven:patchouli-306770:${rootProject.patchouli_file_26_1_2}"
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version_26_1_2}-common-api:${rootProject.jei_version_26_1_2}"
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version_26_1_2}-neoforge-api:${rootProject.jei_version_26_1_2}"
    runtimeOnly "mezz.jei:jei-${rootProject.minecraft_version_26_1_2}-neoforge:${rootProject.jei_version_26_1_2}"
    compileOnly "org.projectlombok:lombok:${rootProject.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${rootProject.lombok_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def p = [mod_id: rootProject.mod_id, mod_name: rootProject.mod_name, mod_version: rootProject.mod_version,
             mod_description: rootProject.mod_description, mod_authors: rootProject.mod_authors, mod_license: rootProject.mod_license,
             minecraft_version_range: rootProject.minecraft_version_range_26_1_2, neo_version: '26.1.2', patchouli_version_range: '[26.1-94,)']
    inputs.properties p; expand p; from 'src/main/templates'; into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = base.archivesName.get() } } }
