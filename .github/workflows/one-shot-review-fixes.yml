name: One-shot review fixes

on:
  push:
    branches: [fix/audit-hardening-2.1]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-hardening-2.1
          fetch-depth: 0
      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          machine_paths = [
              Path("src/main/java/com/nstut/biotech/blocks/entites/machines/GreenhouseBlockEntity.java"),
              Path("src/main/java/com/nstut/biotech/blocks/entites/machines/FermenterBlockEntity.java"),
              Path("src/main/java/com/nstut/biotech/blocks/entites/machines/MixerBlockEntity.java"),
              Path("src/main/java/com/nstut/biotech/blocks/entites/machines/SlaughterhouseBlockEntity.java"),
              Path("src/main/java/com/nstut/biotech/blocks/entites/machines/TerrestrialHabitatBlockEntity.java"),
              Path("src/main/java/com/nstut/biotech/blocks/entites/machines/BreedingChamberBlockEntity.java"),
          ]

          replacements = 0
          for path in machine_paths:
              source = path.read_text()
              count = source.count(".orElseThrow()")
              if count == 0:
                  raise SystemExit(f"Expected no-arg LazyOptional.orElseThrow calls in {path}")
              source = source.replace(".orElseThrow()", ".orElseThrow(IllegalStateException::new)")
              path.write_text(source)
              replacements += count
          if replacements != 32:
              raise SystemExit(f"Expected 32 LazyOptional fixes, got {replacements}")

          dirty_storage = Path("src/main/java/com/nstut/biotech/blocks/entites/hatches/DirtyEnergyStorage.java")
          dirty_storage.write_text('''package com.nstut.biotech.blocks.entites.hatches;\n\nimport net.minecraftforge.energy.EnergyStorage;\n\nimport java.util.Objects;\n\nfinal class DirtyEnergyStorage extends EnergyStorage {\n    private final Runnable onChanged;\n\n    DirtyEnergyStorage(int capacity, int maxReceive, int maxExtract, Runnable onChanged) {\n        super(capacity, maxReceive, maxExtract);\n        this.onChanged = Objects.requireNonNull(onChanged, "onChanged");\n    }\n\n    @Override\n    public int receiveEnergy(int maxReceive, boolean simulate) {\n        int received = super.receiveEnergy(maxReceive, simulate);\n        if (!simulate && received > 0) {\n            onChanged.run();\n        }\n        return received;\n    }\n\n    @Override\n    public int extractEnergy(int maxExtract, boolean simulate) {\n        int extracted = super.extractEnergy(maxExtract, simulate);\n        if (!simulate && extracted > 0) {\n            onChanged.run();\n        }\n        return extracted;\n    }\n}\n''')

          energy_path = Path("src/main/java/com/nstut/biotech/blocks/entites/hatches/EnergyHatchBlockEntity.java")
          energy = energy_path.read_text()
          old = '''    protected final EnergyStorage energyStorage = new EnergyStorage(\n            ENERGY_CAPACITY,\n            ENERGY_THROUGHPUT,\n            ENERGY_THROUGHPUT);'''
          new = '''    protected final EnergyStorage energyStorage = new DirtyEnergyStorage(\n            ENERGY_CAPACITY,\n            ENERGY_THROUGHPUT,\n            ENERGY_THROUGHPUT,\n            this::setChanged);'''
          if old not in energy:
              raise SystemExit("Energy storage declaration did not match expected head")
          energy_path.write_text(energy.replace(old, new))

          test_path = Path("src/test/java/com/nstut/biotech/blocks/entites/hatches/DirtyEnergyStorageTest.java")
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text('''package com.nstut.biotech.blocks.entites.hatches;\n\nimport org.junit.jupiter.api.Test;\n\nimport java.util.concurrent.atomic.AtomicInteger;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\nclass DirtyEnergyStorageTest {\n    @Test\n    void marksDirtyOnlyForSuccessfulExecutedMutations() {\n        AtomicInteger changes = new AtomicInteger();\n        DirtyEnergyStorage storage = new DirtyEnergyStorage(1000, 100, 100, changes::incrementAndGet);\n\n        assertEquals(100, storage.receiveEnergy(100, true));\n        assertEquals(0, changes.get());\n        assertEquals(0, storage.getEnergyStored());\n\n        assertEquals(100, storage.receiveEnergy(100, false));\n        assertEquals(1, changes.get());\n        assertEquals(100, storage.getEnergyStored());\n\n        assertEquals(100, storage.extractEnergy(100, true));\n        assertEquals(1, changes.get());\n        assertEquals(100, storage.getEnergyStored());\n\n        assertEquals(100, storage.extractEnergy(100, false));\n        assertEquals(2, changes.get());\n        assertEquals(0, storage.getEnergyStored());\n\n        assertEquals(0, storage.extractEnergy(100, false));\n        assertEquals(2, changes.get());\n    }\n}\n''')

          old_sha = "dcb077ec173ed7cc4ddbbd1a9b57ba287e077a91"
          new_sha = "06d493ee46ad8465a391c8291fa10abca2c4ff4e"
          for path in [Path("gradle.properties"), Path("src/test/java/com/nstut/biotech/build/CompatibilityTest.java")]:
              text = path.read_text()
              if old_sha not in text:
                  raise SystemExit(f"Expected old NsTut-Lib pin in {path}")
              path.write_text(text.replace(old_sha, new_sha))

          changelog = Path("CHANGELOG-2.1.md")
          text = changelog.read_text()
          marker = "- Make energy input hatches externally receive-only and synchronize absolute energy correctly."
          addition = marker + "\n- Mark successful FE receive/extract mutations dirty so hatch energy persists across chunk unloads."
          if marker not in text:
              raise SystemExit("Expected energy changelog entry")
          changelog.write_text(text.replace(marker, addition))

          workflow = Path(".github/workflows/one-shot-review-fixes.yml")
          workflow.unlink()
          PY

          git config user.name "Lily"
          git config user.email "lily@localhost.invalid"
          git add -A
          git commit -m "fix: address coordinated audit review"
          git push origin HEAD:fix/audit-hardening-2.1
