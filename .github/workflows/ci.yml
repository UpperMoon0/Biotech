name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UpperMoon0/NsTut-Lib
          ref: f64b907bfdf804203304e2ac9cca488203a6b1fd
          path: .ci/nstut-lib
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Publish pinned NsTut Lib to local Maven
        working-directory: .ci/nstut-lib
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace
      - name: Validate and build
        run: ./gradlew test build --no-daemon --stacktrace -Pnstut_lib_dependency=com.nstut.nstutlib:MC-Mod-NsTut-Lib:0.8
      - name: Forge GameTests
        run: ./gradlew runGameTestServer --no-daemon --stacktrace -Pnstut_lib_dependency=com.nstut.nstutlib:MC-Mod-NsTut-Lib:0.8
